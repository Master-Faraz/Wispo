audio:
  sample_rate: 16000
  channels: 1
  device: auto
  frame_ms: 30
asr:
  backend: whisper_cpp
  model: small.en
  model_path: models/ggml-small.en.bin
  device: auto
  quantization: fp16
  threads: 4
  language: en
  gpu_device: 0
streaming:
  chunk_ms: 1000
  overlap_ms: 250
  length_ms: 5000
vad:
  rms_threshold: 0.015
  noise_multiplier: 4.0
  hangover_ms: 700
  preroll_ms: 300
  highpass_hz: 80.0
dictionary:
- phrase: github
  replacement: GitHub
  enabled: true
- phrase: javascript
  replacement: JavaScript
  enabled: true
- phrase: open pull request
  replacement: Open Pull Request
  enabled: true
- phrase: pie torch
  replacement: PyTorch
  enabled: true
- phrase: tensor flow
  replacement: TensorFlow
  enabled: true
- phrase: hugging face
  replacement: Hugging Face
  enabled: true
- phrase: whisper flow
  replacement: WhisperFlow
  enabled: true
- phrase: anti-gravity
  replacement: Antigravity
  enabled: true
- phrase: anti gravity
  replacement: Antigravity
  enabled: true
hotkey:
  keys:
  - copilot
general:
  auto_capitalize: true
  initial_prompt: true
  normalize_audio: true
  silence_guard: true
  final_pass_mode: fast
