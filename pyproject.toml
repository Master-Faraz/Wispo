[project]
name = "whisperflow"
version = "0.1.0"
description = "Local offline speech transcription"
readme = "README.md"
authors = [
    { name = "Faraz Ali", email = "farazali9028@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jeepney>=0.9.0",
    "numpy",
    "pillow>=12.3.0",
    "psutil",
    "pyyaml",
]

[project.scripts]
whisperflow = "whisperflow.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

